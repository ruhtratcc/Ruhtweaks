[package]
name = "ruhtweaks"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
description = "Assistente nativo de pós-instalação do Windows"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"], default-features = false }
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = true }
slint = { version = "=1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.55"
windows = { version = "0.62", features = ["Management_Deployment", "ApplicationModel", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_UpdateAgent", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement_WindowsFirewall"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Registry", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.13.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"


